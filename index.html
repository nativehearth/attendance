<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Attendance</title>
<style>
  :root { --green:#15803d; --amber:#d97706; --red:#b91c1c; --blue:#1e3a8a; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; font-family:system-ui,-apple-system,Roboto,sans-serif; color:var(--ink); background:#f8faf8; }
  .hidden { display:none !important; }
  .screen { min-height:100%; padding:16px; display:flex; flex-direction:column; gap:12px; }
  h1 { font-size:22px; margin:8px 0; } h2 { font-size:17px; margin:6px 0 0; color:var(--muted); font-weight:600; }
  label { display:flex; flex-direction:column; gap:6px; font-weight:600; }
  input { font-size:18px; padding:12px; border:1px solid #cbd5e1; border-radius:10px; width:100%; }
  button { font-size:17px; padding:14px 16px; border-radius:12px; border:1px solid #cbd5e1; background:#fff; color:var(--ink); }
  button:disabled { opacity:.45; }
  button.primary { background:var(--green); color:#fff; border-color:var(--green); font-weight:700; }
  button.secondary { background:var(--blue); color:#fff; border-color:var(--blue); font-weight:700; }
  .row { display:flex; gap:10px; } .row > * { flex:1; }
  .msg { color:var(--muted); margin:0; min-height:1.2em; }
  .small { font-size:13px; color:var(--muted); margin:0; }
  .warn { font-size:14px; color:#92400e; background:#fef3c7; border-radius:10px; padding:10px; margin:0; }

  #home-name { font-size:19px; font-weight:700; user-select:none; -webkit-user-select:none; padding:4px 0; }
  #btn-punch { display:flex; justify-content:space-between; align-items:center; text-align:left; }
  #punch-status { font-size:14px; font-weight:400; opacity:.9; }
  #batch-list { display:flex; flex-direction:column; gap:10px; }
  .batch { text-align:left; display:flex; flex-direction:column; gap:3px; padding:14px 16px; }
  .batch b { font-size:20px; } .batch span { font-size:14px; color:var(--muted); }

  .rc { background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 14px; font-size:15px; display:flex; justify-content:space-between; gap:8px; }
  .rc b { font-size:16px; } .rc .rc-meta { color:var(--muted); font-size:13px; text-align:right; }
  #mark-pane { position:absolute; inset:0; background:#0f172a; display:flex; align-items:center; justify-content:center; padding:24px; }
  #mark-pane button { font-size:22px; padding:24px 20px; width:100%; }
  #class-bar { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:6px 14px; background:#fff; border-bottom:1px solid var(--line); font-size:14px; color:var(--muted); }
  #class-bar button { padding:8px 12px; font-size:15px; }
  #class-bar button.done { background:#dcfce7; border-color:#86efac; color:#14532d; }
  #st-table { width:100%; border-collapse:collapse; font-size:15px; }
  #st-table th, #st-table td { padding:8px 4px; border-bottom:1px solid var(--line); text-align:right; }
  #st-table th:first-child, #st-table td:first-child { text-align:left; }
  #st-table tr.total td { font-weight:700; }
  .list li .name.link { color:#1d4ed8; }
  #scr-resume { justify-content:center; }
  #btn-resume { font-size:22px; padding:28px 16px; }

  #scr-scan { padding:0; gap:0; height:100%; }
  #cam-wrap { position:relative; background:#000; flex:0 0 auto; height:50vh; overflow:hidden; }
  #video { width:100%; height:100%; object-fit:cover; display:block; }
  #flash { position:absolute; inset:0; opacity:0; transition:opacity .35s; pointer-events:none; }
  #flash.on { opacity:.45; transition:none; }
  #aim { position:absolute; left:50%; top:46%; width:62vw; height:62vw; max-width:60%; max-height:78%; transform:translate(-50%,-50%);
         border:3px solid rgba(255,255,255,.7); border-radius:14px; pointer-events:none; }
  #banner { position:absolute; left:0; right:0; bottom:0; padding:10px 12px; background:rgba(0,0,0,.65); color:#fff;
            font-size:20px; font-weight:700; min-height:52px; display:flex; align-items:center; }
  #banner.green { background:rgba(21,128,61,.92); } #banner.amber { background:rgba(217,119,6,.95); } #banner.red { background:rgba(185,28,28,.95); }
  #scan-info { padding:10px 14px; font-size:16px; display:flex; justify-content:space-between; border-bottom:1px solid var(--line); background:#fff; }
  #scan-info b.label { font-size:17px; }
  .list { list-style:none; margin:0; padding:0 8px; background:#fff; }
  #recent { flex:1; overflow:auto; }
  .list li { display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--line); font-size:16px; }
  .list li img { width:34px; height:34px; object-fit:cover; border-radius:6px; }
  .list li .name { flex:1; }
  .list li .meta { color:var(--muted); font-size:13px; text-align:right; }
  .list li .x { border:none; background:none; font-size:20px; color:#9ca3af; padding:6px 10px; }
  .list li.tap { cursor:pointer; }
  .list li.empty { color:var(--muted); }
  .badge { font-size:11px; padding:2px 6px; border-radius:6px; background:#e5e7eb; margin-left:6px; }
  .badge.manual { background:#dbeafe; } .badge.new { background:#fde68a; } .badge.flag { background:#fecaca; }
  .bottom { padding:10px; background:#fff; border-top:1px solid var(--line); }

  .dialog { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; z-index:10; }
  .dialog.full { align-items:stretch; }
  .dlg-body { background:#fff; width:100%; max-height:94vh; overflow:auto; border-radius:16px 16px 0 0; padding:14px;
              display:flex; flex-direction:column; gap:10px; }
  .dialog.full .dlg-body { max-height:none; border-radius:0; }
  #search-results li { padding:14px 6px; font-size:18px; }
  #dlg-photo { z-index:20; }
  #video-photo { width:100%; max-height:58vh; object-fit:cover; border-radius:10px; background:#000; }
  #photo-title { font-weight:700; margin:0; font-size:17px; }

  .tiles { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .tile { display:flex; flex-direction:column; align-items:center; gap:2px; padding:16px 6px; }
  .tile b { font-size:30px; } .tile span { font-size:14px; color:var(--muted); }
  .tile.present b { color:var(--green); } .tile.absent b { color:var(--red); } .tile.manual b { color:var(--blue); }
  #sum-list { max-height:50vh; overflow:auto; }
  #sum-list-title { font-weight:700; margin:4px 0 0; }
</style>
</head>
<body>

<section id="scr-login" class="screen hidden">
  <h1>Student attendance</h1>
  <label>Trainer code<input id="in-trainer" autocapitalize="characters" autocomplete="off" spellcheck="false"></label>
  <button id="btn-login" class="primary">Continue</button>
  <p id="login-msg" class="msg"></p>
</section>

<section id="scr-home" class="screen hidden">
  <div id="home-name"></div>
  <h2>Start class</h2>
  <div id="batch-list"></div>
  <h2 id="recent-title" class="hidden">Last classes</h2>
  <div id="recent-classes"></div>
  <p id="pending-line" class="small hidden"></p>
  <p id="voice-warn" class="warn hidden">No offline voice on this phone. Names will not be spoken without internet.</p>
</section>

<section id="scr-resume" class="screen hidden">
  <button id="btn-resume" class="primary"></button>
</section>

<section id="scr-scan" class="screen hidden">
  <div id="cam-wrap">
    <video id="video" playsinline muted autoplay></video>
    <div id="aim"></div>
    <div id="flash"></div>
    <div id="banner"><span id="banner-text">Starting camera</span></div>
    <div id="mark-pane"><button id="btn-mark" class="secondary">Mark my attendance</button></div>
  </div>
  <div id="scan-info"><b class="label" id="scan-label"></b><span>Marked <b id="scan-count">0</b></span></div>
  <div id="class-bar"><span id="class-status"></span><button id="btn-classphoto">Take class photo</button></div>
  <ul id="recent" class="list"></ul>
  <div class="row bottom"><button id="btn-nocard" class="secondary">No card</button><button id="btn-finish" class="primary">Finish</button></div>
</section>

<div id="dlg-nocard" class="dialog hidden">
  <div class="dlg-body">
    <input id="in-search" placeholder="Type 2 or 3 letters of name" autocomplete="off" spellcheck="false">
    <ul id="search-results" class="list"></ul>
    <button id="btn-add-new" class="secondary hidden"></button>
  </div>
</div>

<div id="dlg-photo" class="dialog hidden">
  <div class="dlg-body">
    <p id="photo-title"></p>
    <video id="video-photo" playsinline muted autoplay></video>
    <button id="btn-photo-take" class="primary">Take photo</button>
  </div>
</div>

<div id="dlg-summary" class="dialog full hidden">
  <div class="dlg-body">
    <h1 id="sum-title" style="margin:4px 0"></h1>
    <div class="tiles">
      <button class="tile present" id="tile-present"><b id="sum-present">0</b><span>Present</span></button>
      <button class="tile absent" id="tile-absent"><b id="sum-absent">0</b><span>Absent</span></button>
      <div class="tile manual"><b id="sum-manual">0</b><span>No card</span></div>
    </div>
    <p id="sum-extra" class="small"></p>
    <button id="btn-sum-photo" class="secondary hidden">Take class photo (needed to submit)</button>
    <p id="sum-photo-ok" class="small hidden"></p>
    <p id="sum-list-title"></p>
    <ul id="sum-list" class="list"></ul>
    <div class="row"><button id="btn-sum-back">Continue scanning</button><button id="btn-submit" class="primary">Submit</button></div>
  </div>
</div>

<div id="dlg-student" class="dialog hidden">
  <div class="dlg-body">
    <b id="st-title"></b>
    <p id="st-msg" class="small"></p>
    <table id="st-table" class="hidden"><thead><tr><th>Course</th><th>Held</th><th>Attended</th><th>Absent</th><th>Absent (%)</th></tr></thead><tbody></tbody></table>
  </div>
</div>

<div id="dlg-admin" class="dialog hidden">
  <div class="dlg-body">
    <b>Admin</b>
    <p id="admin-diag" class="small"></p>
    <div class="row"><button id="btn-a-sync">Send now</button><button id="btn-a-voice">Test voice</button></div>
    <button id="btn-a-refresh">Refresh batches</button>
    <p id="admin-msg" class="msg"></p>
  </div>
</div>

<script src="config.js"></script>
<script src="jsQR.js"></script>
<script src="sender.js"></script>
<script src="app.js"></script>
</body>
</html>
